project_id = "a2-pruefungsakte"

[db]
major_version = 17

[auth]
enabled = true
site_url = "https://a2-pruefungsakte.vercel.app"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173", "https://a2-pruefungsakte.vercel.app"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your A2 Prüfungsakte account"
content_path = "./supabase/templates/confirmation.html"

[auth.rate_limit]
email_sent = 100

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
